version: "3.9"

networks:
  app-net:
    driver: bridge

services:
  # --- GLOBAL POSTGRES ---
  postgres:
    image: postgres:15-alpine
    container_name: ghosthunters-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    networks: [app-net]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- GLOBAL REDIS ---
  redis:
    image: redis:7-alpine
    container_name: ghosthunters-redis
    command: >
      sh -c "redis-server --requirepass ${REDIS_PASSWORD} &
             sleep 3 &&
             redis-cli -a ${REDIS_PASSWORD} < /data/redis_init_location.redis &&
             tail -f /dev/null"
    volumes:
      - redis-data:/data
      - ./db/redis/redis_init_location.redis:/data/redis_init_location.redis
    networks: [app-net]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- GLOBAL MYSQL ---
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/mysql.sql:/docker-entrypoint-initdb.d/mysql.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app-net]
    restart: unless-stopped

  # --- USER MANAGEMENT (.NET) ---
  usermanagement-service:
    image: arinyan/usermanagement-service:2.6
    env_file: .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=users_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - POSTGRES_DB=users_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5169:5169"]
    networks: [app-net]
    restart: unless-stopped

  # --- GHOST AI (.NET) ---
  ghostaiservice:
    image: arinyan/ghostai-service:3.3
    env_file: .env
    environment:
      - DB_CONNECTION_STRING=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=ghostai_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_URLS=http://+:8080
      - Npgsql__MapFieldsAsLowerCase=true
      - POSTGRES_DB=ghostai_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8085:8080"]
    networks: [app-net]
    restart: unless-stopped

  # --- SHOP (FastAPI) ---
  web-shop:
    image: aburdui/shop-service:2.1.1
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/shop_db
      - POSTGRES_DB=shop_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8002:8000"]
    networks: [app-net]
    restart: unless-stopped

  # --- JOURNAL (FastAPI) ---
  web-journal:
    image: aburdui/journal-service:2.2
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/journal_db
      - POSTGRES_DB=journal_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8003:8000"]
    networks: [app-net]
    restart: unless-stopped

  # --- LOBBY (.NET) ---
  lobby:
    image: zagorodniuchka/lobby-service:latest
    platform: linux/arm64
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=lobby_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/lobby_db
      - POSTGRES_DB=lobby_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5144:8080"]
    networks: [app-net]
    restart: unless-stopped

  # --- MAP (.NET) ---
  map:
    image: zagorodniuchka/map-service:latest
    platform: linux/arm64
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=map_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/map_db
      - POSTGRES_DB=map_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["5050:8080"]
    networks: [app-net]
    restart: unless-stopped

  # --- GHOST (Node) ---
  ghost-service:
    image: katrincik123/ghost-service:1.0.9
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/ghosts_db
      - POSTGRES_DB=ghosts_db
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["4001:4001"]
    networks: [app-net]
    restart: unless-stopped

  # --- LOCATION (Node) ---
  location-service:
    image: katrincik123/location-service:1.0.4
    env_file: .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    ports: ["4002:4002"]
    networks: [app-net]
    restart: unless-stopped

  # --- CHAT (FastAPI) ---
  chat:
    image: dgliga/chat-service:latest
    env_file: .env
    command: >
      sh -c "pip install pymysql cryptography &&
             echo 'Waiting for MySQL...' &&
             sleep 10 &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/chat_db
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["8001:8000"]
    networks: [app-net]
    restart: unless-stopped

  # --- INVENTORY (FastAPI) ---
  inventory:
    image: dgliga/inventory-service:latest
    env_file: .env
    command: >
      sh -c "pip install pymysql cryptography &&
             echo 'Waiting for MySQL...' &&
             sleep 10 &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/inventory_db
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["8000:8000"]
    networks: [app-net]
    restart: unless-stopped

  # --- API GATEWAY (Spring Boot) ---
  api-gateway:
    build:
      context: ./GhostHunters_GatewayService/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file: .env
    depends_on:
      - postgres
      - redis
      - mysql
      - usermanagement-service
      - ghostaiservice
      - web-shop
      - web-journal
      - lobby
      - map
      - ghost-service
      - location-service
      - inventory
      - chat
    ports:
      - "8080:8090"
    networks: [app-net]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mysql-data:
