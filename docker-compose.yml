networks:
  app-net:
    external: true
    name: app-net

services:

  messagebroker:
    container_name: message-broker
#    image: katrincik123/message-broker:v1.1.4
    build:
      context: ./MessageBroker
      dockerfile: Dockerfile
    depends_on:
      - discovery
    ports:
      - "8082:8082"
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health/readiness"]
#      interval: 10s
#      timeout: 5s
#      retries: 20
#      start_period: 40s
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s         # how often to check
      timeout: 5s           # request timeout
      start_period: 60s     # give broker time to start + talk to Eureka
      retries: 10           # be patient before calling it unhealthy
    networks:
      - app-net
    restart: unless-stopped

  discovery:
    image: dgliga/discovery-service:v1.2.1
#    build:
#      context: ./DiscoveryService/discovery-server
#      dockerfile: Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
      - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
      - EUREKA_SERVER_EVICTION_INTERVAL_TIMER_IN_MS=5000
      - TELEGRAM_BOT_TOKEN=8163414416:AAGRXsLRAkiBEWqn-Mv3gnJHTgupKdZUIlI
      - TELEGRAM_CHAT_ID=1333295964
    ports:
      - "8761:8761"
    # NOTE: eclipse-temurin:21-jre base usually has no curl/wget; remove healthcheck
    # or install curl in the image. Until then, comment it out:
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 15
    restart: unless-stopped
    networks: [app-net]
  # --- USER MANAGEMENT (.NET) ---

  postgres-users:
    image: bitnami/postgresql:latest
    container_name: postgres-users
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${USER_DB_USER}
      POSTGRESQL_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRESQL_DATABASE: ${USER_DB_NAME}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    volumes:
      - postgres-users-data:/bitnami/postgresql
      - ./db/postgres/users.sql:/docker-entrypoint-initdb.d/001_users.sql:ro
    ports:
      - "5433:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-users-replica:
    image: bitnami/postgresql:latest
    container_name: postgres-users-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-users
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${USER_DB_USER}
      POSTGRESQL_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRESQL_DATABASE: ${USER_DB_NAME}
    depends_on:
      postgres-users:
        condition: service_healthy
    volumes:
      - postgres-users-replica-data:/bitnami/postgresql
    ports:
      - "5439:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  usermanagement-service:
    image: arinyan/usermanagement-service:v3.7.7
    #container_name: usermanagement-service
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5170
      # ✅ Use container name 'postgres-users', not environment variable
      - ConnectionStrings__DefaultConnection=Host=postgres-users,postgres-users-replica;Port=5432;Database=${USER_DB_NAME};Username=${USER_DB_USER};Password=${USER_DB_PASSWORD}
      - eureka__client__serviceUrl__defaultZone=http://discovery:8761/eureka/
      - spring__application__name=usermanagement
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=usermanagement-service
      - PORT=5170
      - SERVICE_HOSTNAME=usermanagement-service
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      postgres-users:
        condition: service_healthy  # ✅ Changed to wait for healthy
      messagebroker:
        condition: service_healthy
    deploy:
      replicas: 1
    #ports:
    #   - "5170:5170"
    expose:
      - "5170"

    networks:
      - app-net

  #   --- GHOST AI (.NET) ---
  postgres-ghostai:
    image: bitnami/postgresql:latest
    container_name: postgres-ghostai
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${GHOSTAI_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${GHOSTAI_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${GHOSTAI_POSTGRES_DB}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    volumes:
      - postgres-ghostai-data:/bitnami/postgresql
      - ./db/postgres/ghostai.sql:/docker-entrypoint-initdb.d/001_ghostai.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GHOSTAI_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-ghostai-replica:
    image: bitnami/postgresql:latest
    container_name: postgres-ghostai-replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-ghostai
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${GHOSTAI_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${GHOSTAI_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${GHOSTAI_POSTGRES_DB}
    depends_on:
      postgres-ghostai:
        condition: service_healthy
    volumes:
      - postgres-ghostai-replica-data:/bitnami/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GHOSTAI_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghostai-service:
    image: arinyan/ghostai-service:v3.5.6
    env_file: .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-ghostai,postgres-ghostai-replica;Port=5432;Database=${GHOSTAI_POSTGRES_DB};Username=${GHOSTAI_POSTGRES_USER};Password=${GHOSTAI_POSTGRES_PASSWORD}
      - ASPNETCORE_URLS=http://+:8080
      - eureka__client__serviceUrl__defaultZone=http://discovery:8761/eureka/
      - spring__application__name=ghostai
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=ghostai-service
      - PORT=8080
      - SERVICE_HOSTNAME=ghostai-service
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      postgres-ghostai:
        condition: service_started
    deploy:
      replicas: 2
    expose:
      - "8080"
    networks:
      - app-net

  # --- SHOP (FastAPI) ---
  shop_db:
    image: bitnami/postgresql:latest
    container_name: shop_db
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${SHOP_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${SHOP_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${SHOP_POSTGRES_DB}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    volumes:
      - shop-data:/bitnami/postgresql
      - ./db/postgres/shop.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5437:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SHOP_POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  shop_db_replica:
    image: bitnami/postgresql:latest
    container_name: shop_db_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: shop_db
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${SHOP_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${SHOP_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${SHOP_POSTGRES_DB}
    depends_on:
      shop_db:
        condition: service_healthy
    volumes:
      - shop-data-replica:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SHOP_POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  web-shop:
    image: aburdui/shop-service:3.1.0
    #container_name: web-shop
    env_file: .env
    environment:
      # - DATABASE_URL=postgresql://${SHOP_POSTGRES_USER}:${SHOP_POSTGRES_PASSWORD}@postgres-shop:5432/${SHOP_POSTGRES_DB}
      - DATABASE_URL=postgresql://${SHOP_POSTGRES_USER}:${SHOP_POSTGRES_PASSWORD}@shop_db,shop_db_replica:5432/${SHOP_POSTGRES_DB}
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=web-shop
      - PORT=8000
      - SERVICE_HOSTNAME=web-shop
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      shop_db:
        condition: service_healthy
      messagebroker:
        condition: service_started
      discovery:
        condition: service_started
    deploy:
      replicas: 2
    #ports:
    #  - "8002:8000"
    expose:
      - "8000"
    networks:
      - app-net
    restart: unless-stopped

  # --- JOURNAL (FastAPI) ---
  journal_db:
    image: bitnami/postgresql:latest
    container_name: journal_db
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${JOURNAL_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${JOURNAL_POSTGRES_DB}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    volumes:
      - journal-data:/bitnami/postgresql
      - ./db/postgres/journal.sql:/docker-entrypoint-initdb.d/journal.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOURNAL_POSTGRES_USER} -d ${JOURNAL_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  journal_db_replica:
    image: bitnami/postgresql:latest
    container_name: journal_db_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: journal_db
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${JOURNAL_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${JOURNAL_POSTGRES_DB}
    depends_on:
      journal_db:
        condition: service_healthy
    volumes:
      - journal-data-replica:/bitnami/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOURNAL_POSTGRES_USER} -d ${JOURNAL_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-journal:
    image: aburdui/journal-service:3.2.3
    #container_name: journal-service
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${JOURNAL_POSTGRES_USER}:${JOURNAL_POSTGRES_PASSWORD}@journal_db,journal_db_replica:5432/${JOURNAL_POSTGRES_DB}
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=web-journal
      - PORT=8000
      - SERVICE_HOSTNAME=web-journal
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      journal_db:
        condition: service_healthy
      messagebroker:
        condition: service_started
      discovery:
        condition: service_started
    deploy:
      replicas: 2
      #ports:
      # - "8003:8000"
    expose:
      - "8000"
    networks:
      - app-net
    restart: unless-stopped

    # --- LOBBY (.NET) ---
  lobby_postgres:
    image: bitnami/postgresql:latest
    container_name: lobby_postgres
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${LOBBY_DB_USER}
      POSTGRESQL_PASSWORD: ${LOBBY_DB_PASSWORD}
      POSTGRESQL_DATABASE: ${LOBBY_DB_NAME}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "5438:5432"
    volumes:
      - ./db/postgres/lobby.sql:/docker-entrypoint-initdb.d/001_lobby.sql:ro
      - lobby-postgres-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LOBBY_DB_USER} -d ${LOBBY_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  lobby_postgres_replica:
    image: bitnami/postgresql:latest
    container_name: lobby_postgres_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: lobby_postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${LOBBY_DB_USER}
      POSTGRESQL_PASSWORD: ${LOBBY_DB_PASSWORD}
      POSTGRESQL_DATABASE: ${LOBBY_DB_NAME}
    depends_on:
      lobby_postgres:
        condition: service_healthy
    volumes:
      - lobby-postgres-replica-data:/bitnami/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LOBBY_DB_USER} -d ${LOBBY_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  lobby-service:
    image: zagorodniuchka/lobby-service:v4.4
    # container_name: lobby-service
#    platform: linux/arm64
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=lobby_postgres,lobby_postgres_replica;Port=5432;Database=${LOBBY_DB_NAME};Username=${LOBBY_DB_USER};Password=${LOBBY_DB_PASSWORD}
      - DATABASE_URL=postgresql://${LOBBY_DB_USER}:${LOBBY_DB_PASSWORD}@lobby_postgres,lobby_postgres_replica:5432/${LOBBY_DB_NAME}
      - POSTGRES_DB=${LOBBY_DB_NAME}
      - eureka__client__serviceUrl__defaultZone=http://discovery:8761/eureka/
      - spring__application__name=lobby-service
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=lobby-service
      - PORT=8080
      - SERVICE_HOSTNAME=lobby-service
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      lobby_postgres:
        condition: service_healthy
    deploy:
      replicas: 2
    #ports: ["5144:8080"]
    expose:
      - "8080"
    networks:
      - app-net
    restart: unless-stopped

  # --- MAP SERVICE (.NET) ---
  map_postgres:
    image: bitnami/postgresql:latest
    container_name: map_postgres
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${MAP_DB_USER}
      POSTGRESQL_PASSWORD: ${MAP_DB_PASSWORD}
      POSTGRESQL_DATABASE: ${MAP_DB_NAME}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    volumes:
      - map_pgdata:/bitnami/postgresql
      - ./db/postgres/map.sql:/docker-entrypoint-initdb.d/001_map.sql:ro
    ports:
      - "5434:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAP_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  map_postgres_replica:
    image: bitnami/postgresql:latest
    container_name: map_postgres_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: map_postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${MAP_DB_USER}
      POSTGRESQL_PASSWORD: ${MAP_DB_PASSWORD}
      POSTGRESQL_DATABASE: ${MAP_DB_NAME}
    depends_on:
      map_postgres:
        condition: service_healthy
    volumes:
      - map_pgdata_replica:/bitnami/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAP_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  map-service:
    image: zagorodniuchka/map-service:v1.8
    #container_name: map-service
#    platform: linux/arm64
    env_file: .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=map_postgres,map_postgres_replica;Port=5432;Database=${MAP_DB_NAME};Username=${MAP_DB_USER};Password=${MAP_DB_PASSWORD}
      - eureka__client__serviceUrl__defaultZone=http://discovery:8761/eureka/
      - spring__application__name=map-service
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=map-service
      - PORT=8080
      - SERVICE_HOSTNAME=map-service
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      map_postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      #ports:
      # - "5050:8080"
    expose:
      - "8080"
    networks:
      - app-net

  #--- GHOST (Node) ---
  ghost_postgres:
    image: bitnami/postgresql:latest
    container_name: ghost_db
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_USERNAME: ${GHOST_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${GHOST_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${GHOST_POSTGRES_DB}
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    volumes:
      - ghost-data:/bitnami/postgresql
      - ./db/postgres/ghosts.sql:/docker-entrypoint-initdb.d/ghosts.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GHOST_POSTGRES_USER} -d ${GHOST_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghost_postgres_replica:
    image: bitnami/postgresql:latest
    container_name: ghost_db_replica
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: ghost_postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: ${GHOST_POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${GHOST_POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${GHOST_POSTGRES_DB}
    depends_on:
      ghost_postgres:
        condition: service_healthy
    volumes:
      - ghost-data-replica:/bitnami/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GHOST_POSTGRES_USER} -d ${GHOST_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghost-service:
    image: katrincik123/ghost-service:3.8
#    build:
#      context: ./GhostService
#      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DB_CONNECTION_STRING=Host=ghost_postgres,ghost_postgres_replica;Port=5432;Database=${GHOST_POSTGRES_DB};Username=${GHOST_POSTGRES_USER};Password=${GHOST_POSTGRES_PASSWORD}
      - ASPNETCORE_URLS=http://+:4001
#      - POSTGRES_HOST=ghost_postgres
#      - POSTGRES_PORT=5432
#      - POSTGRES_DB=${GHOST_POSTGRES_DB}
#      - POSTGRES_USER=${GHOST_POSTGRES_USER}
#      - POSTGRES_PASSWORD=${GHOST_POSTGRES_PASSWORD}
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=ghost-service
      - PORT=4001
      - SERVICE_HOSTNAME=ghost-service
      - EUREKA_HOST=discovery
      - EUREKA_PORT=8761
      - EUREKA_SERVICE_PATH=/eureka/apps/
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      ghost_postgres:
        condition: service_healthy
      messagebroker:
        condition: service_started
      discovery:
        condition: service_started
    deploy:
      replicas: 2
    expose:
      - "4001"
    networks:
      - app-net

    #--- LOCATION (Node) ---
  location_redis:
    image: redis:7-alpine
    container_name: location_redis
    command: [ "redis-server", "--requirepass", "${LOCATION_REDIS_PASSWORD}" ]
    volumes:
      - ghost-redisdata:/data
#      - ./db/redis/redis_init_location.redis:/tmp/init.redis:ro
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${LOCATION_REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  location_redis_replica:
    image: redis:7-alpine
    container_name: location_redis_replica
    command: [
      "redis-server",
      "--replicaof", "location_redis", "6379",
      "--masterauth", "${LOCATION_REDIS_PASSWORD}",
      "--requirepass", "${LOCATION_REDIS_PASSWORD}"
    ]
    networks:
      - app-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${LOCATION_REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  location-service:
    image: katrincik123/location-service:1.9
#    build:
#      context: ./LocationService
#      dockerfile: Dockerfile
    env_file: .env
    environment:
      - LOCATION_REDIS_HOST=location_redis
      - LOCATION_REDIS_PORT=6379
      - LOCATION_REDIS_PASSWORD=${LOCATION_REDIS_PASSWORD}
      - NODE_ENV=production
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=location-service
      - PORT=4002
      - SERVICE_HOSTNAME=location-service
      - EUREKA_HOST=discovery
      - EUREKA_PORT=8761
      - EUREKA_SERVICE_PATH=/eureka/apps/
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      location_redis:
        condition: service_healthy
      messagebroker:
        condition: service_started
      discovery:
        condition: service_started
    deploy:
      replicas: 2
    expose:
      - "4002"
    networks:
      - app-net

  # --- CHAT  ---
  chat_db:
    image: bitnami/mariadb:latest
    container_name: mysql_db_chat
    environment:
      MARIADB_REPLICATION_MODE: master
      MARIADB_ROOT_PASSWORD: ${CHAT_MYSQL_ROOT_PASSWORD}
      MARIADB_REPLICATION_USER: repl_user
      MARIADB_REPLICATION_PASSWORD: repl_password
      MARIADB_USER: ${CHAT_MYSQL_USER}
      MARIADB_PASSWORD: ${CHAT_MYSQL_PASSWORD}
      MARIADB_DATABASE: ${CHAT_MYSQL_DATABASE}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${CHAT_MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_chat_data:/bitnami/mariadb
      - ./db/mysql/chat.sql:/docker-entrypoint-initdb.d/001_chat.sql:ro
    networks:
      - app-net

  chat_db_replica:
    image: bitnami/mariadb:latest
    container_name: mysql_db_chat_replica
    environment:
      MARIADB_REPLICATION_MODE: slave
      MARIADB_REPLICATION_USER: repl_user
      MARIADB_REPLICATION_PASSWORD: repl_password
      MARIADB_MASTER_HOST: mysql_db_chat
      MARIADB_MASTER_PORT_NUMBER: 3306
      MARIADB_MASTER_ROOT_PASSWORD: ${CHAT_MYSQL_ROOT_PASSWORD}
    depends_on:
      chat_db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${CHAT_MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_chat_data_replica:/bitnami/mariadb
    networks:
      - app-net

  chat-service:
    image: dgliga/chat-service:latest
    env_file: .env
    environment:
      DATABASE_URL: "mysql+pymysql://${CHAT_MYSQL_USER}:${CHAT_MYSQL_PASSWORD}@chat_db:3306/${CHAT_MYSQL_DATABASE}?charset=utf8mb4"
      SEED_TOKEN: ${CHAT_SEED_TOKEN}
      EUREKA_URL: http://discovery:8761/eureka/
      APP_NAME: chat-service
      PORT: 8000
      SERVICE_HOSTNAME: chat-service
      BROKER_HTTP_URL: http://message-broker:8082
    depends_on:
      chat_db:
        condition: service_healthy
    deploy:
      replicas: 2
    expose: ["8000"]
    networks: [app-net]
    restart: unless-stopped

  # --- INVENTORY (FastAPI) ---
  inventory-db:
    image: bitnami/mariadb:latest
    container_name: mysql_db
    environment:
      MARIADB_REPLICATION_MODE: master
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_REPLICATION_USER: repl_user
      MARIADB_REPLICATION_PASSWORD: repl_password
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/bitnami/mariadb
      - ./db/mysql/inventory.sql:/docker-entrypoint-initdb.d/001_inventory.sql:ro
    networks:
      - app-net
    restart: unless-stopped

  inventory-db-replica:
    image: bitnami/mariadb:latest
    container_name: mysql_db_replica
    environment:
      MARIADB_REPLICATION_MODE: slave
      MARIADB_REPLICATION_USER: repl_user
      MARIADB_REPLICATION_PASSWORD: repl_password
      MARIADB_MASTER_HOST: mysql_db
      MARIADB_MASTER_PORT_NUMBER: 3306
      MARIADB_MASTER_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data_replica:/bitnami/mariadb
    networks:
      - app-net
    restart: unless-stopped

  inventory-service:
    image: dgliga/inventory-service:latest
    command: >
      sh -c "echo 'Waiting for MySQL...' &&
             sleep 10 &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@inventory-db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - SEED_TOKEN=${SEED_TOKEN}
      # 👇 Eureka registrar in your FastAPI main.py uses these
      - EUREKA_URL=http://discovery:8761/eureka/
      - APP_NAME=inventory-service
      - PORT=8000
      - SERVICE_HOSTNAME=inventory-service
      - BROKER_HTTP_URL=http://message-broker:8082
    depends_on:
      discovery:
        condition: service_started
      inventory-db:
        condition: service_healthy
    deploy:
      replicas: 2
    expose: ["8000"]
    networks: [app-net]
    restart: unless-stopped

  # --- API GATEWAY (Spring Boot) ---
  api-gateway:
    build:
      context: ./GhostHunters_GatewayService/gateway
      dockerfile: Dockerfile
#    image: dgliga/gateway-service:v1.4.1
    # container_name: api-gateway
    env_file: .env
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SERVER_PORT=8090
      # ✅ Enable Gateway <-> Eureka integration (if the gateway has the client on classpath)
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      # Disable auto-discovery routing; gateway only exposes user-facing routes
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=false
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWERCASESERVICEID=false
      - USER_SERVICE_URL=http://usermanagement-service:5170
      - GHOSTAI_SERVICE_URL=http://ghostai-service:8080
      - JOURNAL_SERVICE_URL=http://web-journal:8000
      - SHOP_SERVICE_URL=http://web-shop:8000
      - GHOST_SERVICE_URL=http://ghost-service:4001
      - LOCATION_SERVICE_URL=http://location-service:4002
      - INVENTORY_SERVICE_URL=http://inventory-service:8000
      - CHAT_SERVICE_URL=http://chat-service:8000
      - MAP_SERVICE_URL=http://map-service:8080
      - LOBBY_SERVICE_URL=http://lobby-service:8080

      - DISABLE_AUTH=false
      - JWT_SECRET=ghosthunters-0123456789-abcdef-12345678
#      - JWT_SECRET=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkZW1vLXVzZXIiLCJleHAiOjE3NjQzNDQwODJ9.mZr5yYO6K8niQOp46QHlBUiShoU2bxGb3drZlZjYTEk



    depends_on:
      - discovery
      - usermanagement-service
      - ghostai-service
      - web-journal
      - location-service
      - ghost-service
      - web-shop
      - inventory-service
      - chat-service
      - lobby-service
      - map-service

    ports:
      - "8080:8090"
    networks:
      - app-net
    restart: unless-stopped

volumes:
  postgres-users-data:
  postgres-ghostai-data:
  postgres-map-data:
  journal-data:
  shop-data:
  ghost-data:
  ghost-redisdata:
  mysql_data:
  lobby-postgres-data:
  mysql_chat_data:
  map_pgdata:
  map_pgdata_replica:
  postgres-ghostai-replica-data:
  postgres-users-replica-data:
  shop-data-replica:
  journal-data-replica:
  lobby-postgres-replica-data:
  ghost-data-replica:
  mysql_data_replica:
  mysql_chat_data_replica:
