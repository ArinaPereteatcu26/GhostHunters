services:
  # --- MySQL for Inventory ---
  db_inventory:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${INV_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${INV_DB}
      MYSQL_USER: ${INV_DB_USER}
      MYSQL_PASSWORD: ${INV_DB_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${INV_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - inv_mysql_data:/var/lib/mysql
      - ./db/inventory.sql:/docker-entrypoint-initdb.d/001_inventory.sql:ro
    # (No host port needed; app talks over internal network)

  inventory:
    image: ${INV_IMAGE}     # e.g., dgliga/inventory-service:6
    platform: linux/amd64
    environment:
      DATABASE_URL: "mysql+pymysql://${INV_DB_USER}:${INV_DB_PASSWORD}@db_inventory:3306/${INV_DB}?charset=utf8mb4"
      SEED_TOKEN: ${INV_SEED_TOKEN}
    depends_on:
      db_inventory:
        condition: service_healthy
    ports:
      - "8000:8000"         # Inventory API on http://localhost:8000
    restart: unless-stopped

  # --- MySQL for Chat ---
  db_chat:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${CHAT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CHAT_DB}
      MYSQL_USER: ${CHAT_DB_USER}
      MYSQL_PASSWORD: ${CHAT_DB_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${CHAT_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - chat_mysql_data:/var/lib/mysql
      - ./db/chat.sql:/docker-entrypoint-initdb.d/001_chat.sql:ro

  chat:
    image: ${CHAT_IMAGE}    # e.g., dgliga/chat-service:4
    platform: linux/amd64
    environment:
      DATABASE_URL: "mysql+pymysql://${CHAT_DB_USER}:${CHAT_DB_PASSWORD}@db_chat:3306/${CHAT_DB}?charset=utf8mb4"
      SEED_TOKEN: ${CHAT_SEED_TOKEN}
    depends_on:
      db_chat:
        condition: service_healthy
    ports:
      - "8001:8000"         # Chat API on http://localhost:8001
    restart: unless-stopped

    # --- Postgres for Ghost Service ---
  ghost_postgres:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 30
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ghost_pgdata:/var/lib/postgresql/data
      - ./db/ghosts.sql:/docker-entrypoint-initdb.d/001_ghosts.sql:ro

  ghost-service:
    image: ${GHOST_IMAGE}
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - "4001:4001"
    depends_on:
      ghost_postgres:
        condition: service_healthy

  # --- Redis for Location Service ---
  location_redis:
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 30
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  location-service:
    image: ${LOCATION_IMAGE}
    platform: linux/amd64
    env_file:
      - .env
    ports:
      - "4002:4002"
    depends_on:
      location_redis:
        condition: service_healthy

  # --- Postgres for Usermanagement Service ---
  postgres:
    image: postgres:15-alpine
    container_name: usermanagement_postgres_dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - usermanagement_pgdata:/var/lib/postgresql/data
      - ./db/usermanagement.sql:/docker-entrypoint-initdb.d/001_usermanagement.sql:ro
    networks:
      - usermanagement_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  usermanagement-service:
    image: ${USERMANAGEMENT_IMAGE}
    platform: linux/amd64
    container_name: usermanagement_service_dev
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    ports:
      - "5170:5169"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - usermanagement_network
    restart: unless-stopped

    # --- Postgres & Redis for GhostAi Service ---
  db_ghostai:
    image: postgres:15-alpine
    container_name: ghostai_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${GHOSTAI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GHOSTAI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GHOSTAI_POSTGRES_DB}
    ports:
      - "5438:5432"
    volumes:
      - ghostai_pgdata:/var/lib/postgresql/data
      - ./db/ghostai.sql:/docker-entrypoint-initdb.d/001_ghostai.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis_ghostai_dev
    restart: always
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
      start_period: 5s

  ghostaiservice:
    image: ${GHOSTAI_IMAGE}
    platform: linux/amd64
    container_name: ghostai_service_dev
    restart: always
    ports:
      - "8085:8080"
      - "8086:8081"
    depends_on:
      db_ghostai:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: "Host=db_ghostai;Port=5432;Database=${GHOSTAI_POSTGRES_DB};Username=${GHOSTAI_POSTGRES_USER};Password=${GHOSTAI_POSTGRES_PASSWORD}"
      REDIS_CONNECTION_STRING: "redis:6381"

  # --- Postgres for Journal service ---
  db_journal:
    image: postgres:15
    container_name: journal-db
    environment:
      POSTGRES_USER: ${JOURNAL_DB_USER}
      POSTGRES_PASSWORD: ${JOURNAL_DB_PASSWORD}
      POSTGRES_DB: ${JOURNAL_DB}
    volumes:
      - journal_data:/var/lib/postgresql/data
      - ./db/journal.sql:/docker-entrypoint-initdb.d/journal.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journal_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  web_journal:
    image: ${JOURNAL_IMAGE}
    platform: linux/amd64
    container_name: journal-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    depends_on:
      - db_journal

  # --- Postgres for Shop service ---
  db_shop:
    image: postgres:15
    container_name: shop-db
    environment:
      POSTGRES_USER: ${SHOP_DB_USER}
      POSTGRES_PASSWORD: ${SHOP_DB_PASSWORD}
      POSTGRES_DB: ${SHOP_DB}
    volumes:
      - shop_data:/var/lib/postgresql/data
      - ./db/shop.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  web_shop:
    image: ${SHOP_IMAGE}
    platform: linux/amd64
    container_name: shop-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    depends_on:
      db_shop:
        condition: service_healthy
    
  # --- Postgres for Lobby Service ---
  lobby-postgres:
    image: postgres:16-alpine
    container_name: lobby_postgres_dev
    environment:
      POSTGRES_DB: ${LOBBY_DB_NAME}
      POSTGRES_USER: ${LOBBY_DB_USER}
      POSTGRES_PASSWORD: ${LOBBY_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - lobby_pgdata:/var/lib/postgresql/data
      - ./db/lobby.sql:/docker-entrypoint-initdb.d/001_lobby.sql:ro
    networks:
      - lobby_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOBBY_DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  lobbyservice:
    image: ${LOBBY_IMAGE}
#    platform: linux/amd64
    container_name: lobby_service_dev
    environment:
      - ConnectionStrings__DefaultConnection=Host=lobby-postgres;Port=5432;Database=${LOBBY_DB_NAME};Username=${LOBBY_DB_USER};Password=${LOBBY_DB_PASSWORD}
    ports:
      - "5144:8080"
    depends_on:
      lobby-postgres:
        condition: service_healthy
    networks:
      - lobby_network
    restart: unless-stopped

  # --- Postgres for Map Service ---
  map-postgres:
    image: postgres:15-alpine
    container_name: map_postgres_dev
    environment:
      POSTGRES_DB: ${MAP_DB_NAME}
      POSTGRES_USER: ${MAP_DB_USER}
      POSTGRES_PASSWORD: ${MAP_SA_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - map_pgdata:/var/lib/postgresql/data
      - ./db/map.sql:/docker-entrypoint-initdb.d/001_map.sql:ro
    networks:
      - map_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAP_DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mapservice:
    image: ${MAP_IMAGE}
#    platform: linux/amd64
    container_name: map_service_dev
    environment:
      - DB_HOST=map-postgres
      - DB_PORT=5432
      - DB_NAME=${MAP_DB_NAME}
      - DB_USER=${MAP_DB_USER}
      - SA_PASSWORD=${MAP_SA_PASSWORD}
    ports:
      - "5000:8080"
    depends_on:
      map-postgres:
        condition: service_healthy
    networks:
      - map_network
    restart: unless-stopped
    
volumes:
  inv_mysql_data:
  chat_mysql_data:
  ghost_pgdata:
  redisdata:
  usermanagement_pgdata:
  ghostai_pgdata:
  redis_data:
  lobby_pgdata:
  map_pgdata:
  shop_data:
  journal_data:

networks:
  usermanagement_network:
    driver: bridge
  lobby_network:  
    driver: bridge
  map_network: 
    driver: bridge